name: obligatorio-msr

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

# Una sola red plana, igual que la propuesta reducida (192.168.56.0/24).
# El gateway es .254 (puente de Docker) y da salida a Internet para Telegram y SMTP.
#
# Las IP de los siete contenedores son fijas y son las de la documentacion:
#   web01 .10 | zabbix-server .20 | zabbix-web .21 | zabbix-db .22 | grafana .23 | loki .24
#   mon-agent .25
# Cada una va en su servicio, con ipv4_address. Docker las respeta en cada arranque y no
# dependen del orden en que levanten los contenedores.
#
# El puente lleva nombre fijo (br-lab) en vez del br-<id> que Docker genera solo:
# asi las reglas de iptables de scripts/acceso-lan.sh y los tcpdump de las evidencias
# siguen valiendo aunque se recree la red.
networks:
  lab:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-lab
    ipam:
      driver: default
      config:
        - subnet: 192.168.56.0/24
          gateway: 192.168.56.254

volumes:
  zabbix_db:
  loki_data:
  grafana_data:

services:
  # ---------- Servidor web monitoreado ----------
  web01:
    <<: *logs
    build: ./web01
    container_name: web01
    hostname: web01
    restart: unless-stopped
    init: true
    cap_add: [NET_ADMIN, NET_RAW]   # NET_ADMIN: prueba P5b (bajar la interfaz)
    oom_score_adj: 500
    # Límites propios: la CPU y la RAM de web01 se miden contra ellos (template
    # "Contenedor web01 (cgroup v2)") y una prueba de carga no puede ahogar a Zabbix.
    # Los valores los calcula init.sh según la VM; se ajustan en .env.
    #
    # CPU: cpuset (núcleos fijos) y NO "cpus:" (cuota). Con cuota, el kernel frena al
    # contenedor cada 100 ms con temporizadores; en una VM de VirtualBox sin VT-x, que
    # corre sobre Hyper-V (NEM), eso congelaba la VM entera durante P1: load de 63 y
    # mediciones erráticas. Con cpuset, web01 queda estable al 94 % de su núcleo y el
    # núcleo 0 queda libre para el resto del laboratorio. Medido en la VM.
    # memswap_limit igual a mem_limit: sin swap, así la prueba de RAM mide RAM.
    cpuset: ${WEB01_CPUSET:?falta ejecutar scripts/init.sh}
    mem_limit: ${WEB01_MEM:?falta ejecutar scripts/init.sh}
    memswap_limit: ${WEB01_MEM:?falta ejecutar scripts/init.sh}
    environment:
      TZ: America/Montevideo
      SNMP_AUTH: ${SNMP_AUTH:?falta ejecutar scripts/init.sh}
      SNMP_PRIV: ${SNMP_PRIV:?falta ejecutar scripts/init.sh}
    ports:
      - "80:80"
    volumes:
      - ./secrets/web01.psk:/secrets/web01.psk:ro
      # Disco propio de web01 (sudo sh scripts/disco-web01.sh). Si no se creó, Docker
      # crea una carpeta común en el disco de la VM y verificar.sh lo marca.
      - /srv/msr/web01-datos:/datos
    networks:
      lab: { ipv4_address: 192.168.56.10 }

  # ---------- Agente de infraestructura: contenedores y PostgreSQL ----------
  # Es el ÚNICO contenedor con acceso al socket de Docker. Quien habla con el socket
  # controla Docker entero, o sea la VM: por eso no va en web01, que está expuesto y
  # tiene un CGI. Este no publica puertos, solo atiende a zabbix-server con TLS-PSK y
  # el agente 2 no permite system.run. El ":ro" NO limita la API (solo impide tocar el
  # archivo del socket); se deja igual, pero no es una medida de seguridad.
  mon-agent:
    <<: *logs
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: mon-agent
    hostname: mon-agent
    restart: unless-stopped
    group_add: ["${DOCKER_GID:?falta ejecutar scripts/init.sh}"]
    environment:
      TZ: America/Montevideo
      ZBX_HOSTNAME: mon-agent
      ZBX_SERVER_HOST: 192.168.56.20
      ZBX_TLSCONNECT: psk
      ZBX_TLSACCEPT: psk
      ZBX_TLSPSKIDENTITY: PSK-mon-agent
      ZBX_TLSPSKFILE: /var/lib/zabbix/enc/mon-agent.psk
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./secrets/mon-agent.psk:/var/lib/zabbix/enc/mon-agent.psk:ro
    networks:
      lab: { ipv4_address: 192.168.56.25 }

  # ---------- mon01: un contenedor por servicio ----------
  zabbix-server:
    <<: *logs
    build: ./zabbix-server
    container_name: zabbix-server
    hostname: mon01
    restart: unless-stopped
    cap_add: [NET_RAW]              # NET_RAW: fping / ICMP hacia web01
    oom_score_adj: -500
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      TZ: America/Montevideo
      DB_SERVER_HOST: 192.168.56.22
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?falta ejecutar scripts/init.sh}
    networks:
      lab: { ipv4_address: 192.168.56.20 }

  zabbix-web:
    <<: *logs
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: zabbix-web
    hostname: zabbix-web
    restart: unless-stopped
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      TZ: America/Montevideo
      PHP_TZ: America/Montevideo
      ZBX_SERVER_HOST: 192.168.56.20
      ZBX_SERVER_NAME: mon01
      DB_SERVER_HOST: 192.168.56.22
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?falta ejecutar scripts/init.sh}
    ports:
      - "8080:8080"
    networks:
      lab: { ipv4_address: 192.168.56.21 }

  zabbix-db:
    <<: *logs
    image: postgres:16-alpine
    container_name: zabbix-db
    hostname: zabbix-db
    restart: unless-stopped
    oom_score_adj: -500
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=100
    environment:
      TZ: America/Montevideo
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?falta ejecutar scripts/init.sh}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - zabbix_db:/var/lib/postgresql/data
    networks:
      lab: { ipv4_address: 192.168.56.22 }

  grafana:
    <<: *logs
    build: ./grafana
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    depends_on: [loki]
    environment:
      TZ: America/Montevideo
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?falta ejecutar scripts/init.sh}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      lab: { ipv4_address: 192.168.56.23 }

  loki:
    <<: *logs
    image: grafana/loki:3.5.0
    container_name: loki
    hostname: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      lab: { ipv4_address: 192.168.56.24 }
