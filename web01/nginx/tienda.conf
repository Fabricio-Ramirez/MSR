server {
    listen 80;
    server_name tienda.local 192.168.56.10;

    root  /var/www/tienda;
    index index.html;

    access_log /var/log/nginx/tienda_access.log timed;
    error_log  /var/log/nginx/tienda_error.log warn;

    # Solo para la prueba P6
    location = /error500 { return 500; }

    # Pruebas de carga disparadas desde el panel oculto (P1, P2 y P3).
    # Un único script, con las acciones fijas que él mismo valida.
    location = /api/carga {
        fastcgi_pass  unix:/run/fcgiwrap/fcgiwrap.sock;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/lib/cgi-bin/carga.sh;
        fastcgi_read_timeout 20s;
    }
}

# Estado interno de Nginx para Zabbix (solo localhost)
server {
    listen 127.0.0.1:8080;

    location = /basic_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
